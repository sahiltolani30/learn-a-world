[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-a-world"
version = "0.1.0"
description = "A JEPA-style latent world model that learns by playing"
readme = "README.md"
authors = [{ name = "Sahil Tolani", email = "sahiltolani86@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
